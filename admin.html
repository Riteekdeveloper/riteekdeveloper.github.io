<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Admin Login | RITIK.DEV</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #fff;
      background:
        radial-gradient(ellipse at top, #3b1010 0%, transparent 50%),
        #080808;
    }

    .login-box {
      width: 100%;
      max-width: 410px;
      padding: 32px 25px;
      background: #141414;
      border: 1px solid #492020;
      border-radius: 18px;
      box-shadow: 0 0 40px #ff202018;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 9px;
    }

    .logo span {
      color: #ff3030;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .security {
      padding: 11px;
      margin-bottom: 20px;
      text-align: center;
      color: #ff7777;
      background: #ff30300c;
      border: 1px solid #4b2424;
      border-radius: 9px;
      font-size: 12px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 13px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #383838;
      background: #090909;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #ff3030;
      box-shadow: 0 0 0 2px #ff303018;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #e52424;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover {
      background: #ff3535;
    }

    button:active {
      transform: scale(.99);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #dashboard {
      display: none;
    }

    .success-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 17px;
      border-radius: 50%;
      background: #10351e;
      color: #65ff9a;
      font-size: 28px;
    }

    #dashboard h2 {
      text-align: center;
      font-size: 22px;
    }

    .note {
      margin-top: 12px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
      line-height: 1.6;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #bbb;
      text-decoration: none;
      font-size: 13px;
    }

    .back-link:hover {
      color: #ff4040;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #666;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">RITIK<span>.DEV</span></div>
    <p class="subtitle">Secure Administrator Portal</p>

    <div class="security">
      🔒 Protected Admin Access
    </div>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter your admin email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button id="loginButton" type="submit">
        SECURE LOGIN →
      </button>
    </form>

    <section id="dashboard">
      <div class="success-icon">✓</div>
      <h2>Admin Access Verified</h2>
      <p class="note">
        Your identity has been verified successfully.
        The project management dashboard will be added next.
      </p>
      <button id="logoutButton" type="button">LOGOUT</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back-link" href="index.html">
      ← Back to RITIK.DEV
    </a>

    <div class="footer">
      RITIK.DEV · ADMIN PORTAL
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Supabase project settings
    const SUPABASE_URL =
      "https://oexxggdbvvujvnfgrxlp.supabase.co";

    // Use only the Publishable key here.
    // Never put a secret or service_role key in frontend code.
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_aSp4OkJMiRaqJ4h84j85OA_EKGRHvUk";

    // Your authorized Supabase user ID
    const ADMIN_UID =
      "7dfdb8ca-fc37-4632-9ee0-cd1c14c08530";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const logoutButton = document.getElementById("logoutButton");

    let supabaseClient = null;
    let busy = false;

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "#65ff9a" : "#ff7777";
    }

    function showLogin() {
      loginForm.style.display = "block";
      dashboard.style.display = "none";
    }

    function showAdmin() {
      loginForm.style.display = "none";
      dashboard.style.display = "block";
      showMessage("Admin identity verified.", true);
    }

    async function initializeSupabase() {
      if (supabaseClient) return true;

      if (!window.supabase) {
        showMessage(
          "Supabase library load nahi hui. Internet check karke page reload karo."
        );
        return false;
      }

      if (
        !SUPABASE_PUBLISHABLE_KEY ||
        SUPABASE_PUBLISHABLE_KEY ===
          "sb_publishable_aSp4OkJMiRaqJ4h84j85OA_EKGRHvUk"
      ) {
        showMessage(
          "Pehle apni Publishable key code mein paste karo."
        );
        return false;
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      return true;
    }

    async function checkCurrentSession() {
      if (!(await initializeSupabase())) return;

      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        const user = data.session?.user;

        if (!user) {
          showLogin();
          return;
        }

        if (user.id !== ADMIN_UID) {
          await supabaseClient.auth.signOut();
          showLogin();
          showMessage("Is account ko Admin access nahi hai.");
          return;
        }

        showAdmin();
      } catch (error) {
        showLogin();
        showMessage("Session check nahi ho saka. Dobara try karo.");
      }
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (busy) return;

      busy = true;
      loginButton.disabled = true;
      loginButton.textContent = "VERIFYING...";
      showMessage("");

      try {
        if (!(await initializeSupabase())) return;

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          showMessage("Login failed. Email ya password check karo.");
          return;
        }

        if (!data.user || data.user.id !== ADMIN_UID) {
          await supabaseClient.auth.signOut();
          showMessage("Is account ko Admin access nahi hai.");
          return;
        }

        showAdmin();
      } catch (error) {
        showMessage("Connection error. Internet check karke try karo.");
      } finally {
        busy = false;
        loginButton.disabled = false;
        loginButton.textContent = "SECURE LOGIN →";
      }
    });

    logoutButton.addEventListener("click", async function() {
      if (!supabaseClient) return;

      logoutButton.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) throw error;

        loginForm.reset();
        showLogin();
        showMessage("You have logged out.", true);
      } catch (error) {
        showMessage("Logout nahi ho saka. Dobara try karo.");
      } finally {
        logoutButton.disabled = false;
      }
    });

    checkCurrentSession();
  </script>
</body>
</html>
